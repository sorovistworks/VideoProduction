<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>starter</title>
<style>
  /* Fonts: put .woff2 files in the shared /fonts folder and declare them here, e.g.
     @font-face { font-family: "Inter"; src: url("/fonts/Inter.woff2") format("woff2"); font-weight: 100 900; } */
  html, body { margin: 0; height: 100%; background: #07070a; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script type="module">
import { spring, lerp, clamp, rng } from '/engine/motion.js';

window.DURATION = 5;
const ACCENT = '#e50914';
const FONT = '"Inter", "Segoe UI", system-ui, sans-serif';

const c = document.getElementById('c'), g = c.getContext('2d');
const W = (c.width = innerWidth), H = (c.height = innerHeight);
const u = Math.min(W, H) / 1080;          // layout unit: one design for 16:9 and 9:16
const portrait = H > W;
const crit = (k) => 2 * Math.sqrt(k);     // critically damped: no overshoot (use on type)

// Film grain: one seeded tile, offset per frame.
const tile = document.createElement('canvas');
tile.width = tile.height = 256;
{
  const tg = tile.getContext('2d'), img = tg.createImageData(256, 256), r = rng(7);
  for (let i = 0; i < img.data.length; i += 4) {
    img.data[i] = img.data[i + 1] = img.data[i + 2] = r() * 255;
    img.data[i + 3] = 255;
  }
  tg.putImageData(img, 0, 0);
}
const grain = g.createPattern(tile, 'repeat');

window.seek = (t) => {
  const f = Math.round(t * 60);

  // Stage: near-black with a slow drifting glow.
  g.fillStyle = '#07070a';
  g.fillRect(0, 0, W, H);
  const gx = W * (0.3 + 0.1 * Math.sin(t * 0.6)), gy = H * (0.6 + 0.08 * Math.cos(t * 0.45));
  const glow = g.createRadialGradient(gx, gy, 0, gx, gy, Math.max(W, H) * 0.7);
  glow.addColorStop(0, 'rgba(120,10,20,0.55)');
  glow.addColorStop(1, 'rgba(0,0,0,0)');
  g.fillStyle = glow;
  g.fillRect(0, 0, W, H);

  // Camera: constant slow push + a seeded shake that decays after the slam lands.
  const LAND = 0.22;
  const kick = t >= LAND ? Math.max(0, 1 - (t - LAND) / 0.35) : 0;
  const sr = rng(f + 1);
  g.save();
  g.translate(W / 2 + (sr() - 0.5) * 28 * u * kick, H / 2 + (sr() - 0.5) * 28 * u * kick);
  const push = 1 + 0.05 * (t / window.DURATION);
  g.scale(push, push);
  g.translate(-W / 2, -H / 2);

  const size = (portrait ? 230 : 210) * u;
  const x0 = portrait ? 90 * u : W * 0.14;
  const y1 = H / 2 - size * 0.2, y2 = y1 + size * 1.02;
  g.textBaseline = 'alphabetic';
  g.font = `800 ${size}px ${FONT}`;

  // Line 1 slams in from depth, readable by 0.25 s.
  const a = spring(t, 600, crit(600));
  g.save();
  g.globalAlpha = clamp(a * 4);
  g.translate(x0, y1);
  g.scale(lerp(2.6, 1, a), lerp(2.6, 1, a));
  g.fillStyle = '#fff';
  g.fillText('Made', 0, 0);
  g.restore();

  // Line 2 rises out of a mask.
  const b = spring(t - 0.7, 220, crit(220));
  const wIn = g.measureText('in ').width, wAll = wIn + g.measureText('code.').width;
  g.save();
  g.beginPath();
  g.rect(x0 - 20 * u, y2 - size * 0.9, wAll + 40 * u, size * 1.15);
  g.clip();
  const dy = lerp(size, 0, b);
  g.fillStyle = '#fff';
  g.fillText('in ', x0, y2 + dy);
  g.fillStyle = ACCENT;
  g.fillText('code.', x0 + wIn, y2 + dy);
  g.restore();

  // Accent line draws under it (a hair of overshoot is fine on shapes).
  const lw = wAll * clamp(spring(t - 1.4, 120, 20), 0, 1.03);
  g.fillStyle = ACCENT;
  g.fillRect(x0, y2 + size * 0.22, lw, 10 * u);

  // Sub-line rises in.
  const s = spring(t - 2.2, 180, crit(180));
  g.globalAlpha = s;
  g.font = `500 ${40 * u}px ${FONT}`;
  g.fillStyle = 'rgba(255,255,255,0.72)';
  g.fillText('window.seek(t)  ·  60 fps  ·  0 credits', x0, y2 + size * 0.22 + 80 * u + lerp(30 * u, 0, s));
  g.globalAlpha = 1;
  g.restore();

  // Grain on top.
  const gr = rng(f * 7 + 3);
  g.save();
  g.globalAlpha = 0.06;
  g.translate(-gr() * 256, -gr() * 256);
  g.fillStyle = grain;
  g.fillRect(0, 0, W + 256, H + 256);
  g.restore();
};

// Preview mode (no ?render): play in real time, or freeze at ?t=seconds.
const q = new URLSearchParams(location.search);
if (!q.has('render')) {
  const T = q.has('t') ? Number(q.get('t')) : null, t0 = performance.now();
  const loop = () => {
    window.seek(T ?? ((performance.now() - t0) / 1000) % window.DURATION);
    if (T === null) requestAnimationFrame(loop);
  };
  document.fonts.ready.then(loop);
}
</script>
</body>
</html>
